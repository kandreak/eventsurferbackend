[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "events-aggregator-backend"
version = "0.1.0"
description = "A FastAPI backend for collecting and organizing local events."
requires-python = ">=3.12"
dependencies = [
    "apify-client>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "google-genai>=2.0,<3.0",
    "icalendar>=6.0,<7.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "pymongo>=4.13,<5.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
events-worker = "events.worker:main"

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
